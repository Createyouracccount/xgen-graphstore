[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-graphstore"
version = "0.1.0"
description = "Backend-neutral ontology graph store for XGEN — OntologyStore interface + Fuseki backend."
readme = "README.md"
requires-python = ">=3.10"
# 공유 커널: 최소 의존. transport 만 httpx. call-logging 은 주입식(선택).
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
# 라이브 스모크 등 개발용
dev = ["pytest>=7", "pytest-asyncio>=0.21"]
# LPG 백엔드(Neo4j) — 코어는 이것 없이 동작. create_store({"backend":"neo4j"}) 때만 필요.
neo4j = ["neo4j>=5"]

[project.scripts]
graphstore = "xgen_graphstore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_graphstore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: 실제 Fuseki(docker) 필요한 라이브 스모크 — CI 기본 제외(-m live 로만 실행)",
]
